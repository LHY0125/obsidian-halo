name: Release

# 打 tag 触发：构建后把 manifest.json + main.js 作为 Release 产物。
#
# ⚠️ tag 必须与 manifest.json 的 `version` **完全一致**，且**不带 `v` 前缀**
#（`.npmrc` 设了 `tag-version-prefix=""`）。Obsidian 正是按这个对应关系去
# 找 release 并下载 main.js / manifest.json / styles.css —— 对不上就会装到旧版本。
#
# `workflow_dispatch` 是刻意加的：只有 `push: tags` 时，workflow 一旦没被触发
# 就**无法手动重跑**（`gh workflow run` 会报 422「does not have workflow_dispatch trigger」），
# 只能再打一个 tag。留一个手动入口，排查时不必污染 tag 列表。
#
# ⚠️ **本仓库是 fork，`push` 触发在 fork 上不生效** —— 这是实测结论，不是猜测。
#
# 证据：仓库 `fork: true`（parent `halo-sigs/obsidian-halo`）。Actions 本身是启用的
#（`actions/permissions` 返回 `enabled: true`），workflow 也是 `active`，文件在 tag 指向的
# commit 里确实存在，tag 配置 `push: tags: ["*"]` 也正确 —— 但推 tag 后运行列表里
# **一条 push 触发的记录都没有**（总共只有 2 条，都是 workflow_dispatch）。
# GitHub 对 fork 默认不运行 `push` 触发的 workflow，这是平台行为。
#
# 所以发布流程是：**推 tag 之后必须手动跑一次**
#
#     gh workflow run Release --repo LHY0125/obsidian-halo --ref 0.1.0
#
# `--ref` 必须指向 **tag**（不是 main）。指向 main 会失败，报
# 「⚠️ GitHub Releases requires a tag」—— 因为 `softprops/action-gh-release` 要靠
# 当前 ref 推断要往哪个 release 传产物，而 main 上没有 tag 上下文。
#
# 实测：`--ref 0.1.0` 跑通，产出的 main.js / manifest.json 与本地产物 sha256 逐字节一致。
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ **不要**在这里写 `node-version` 之外的 pnpm 版本 —— pnpm 版本由
      # `package.json` 的 `packageManager` 字段（`pnpm@10.34.4`）唯一决定。
      # 此前这里写的是 `pnpm/action-setup@v2` + `version: 8`，与 `packageManager`
      # **冲突**：action-setup v2 在两者不一致时直接报
      # 「Multiple versions of pnpm specified」并中止 job。
      # 现在改用 corepack（Node 自带）读 `packageManager`，只有一处真值来源。
      #
      # ⚠️ **`cache: pnpm` 必须排在 `corepack enable` 之后**：setup-node 的 pnpm 缓存
      # 需要**先**能在 PATH 上找到 `pnpm` 才敢去问它 store 目录，否则直接
      # 「Unable to locate executable file: pnpm」。所以这里**不写** `cache: pnpm`，
      # 缓存交给下面的 `pnpm store path` 那一步自己管。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ⚠️ 这三步是「构建可复现」的**证据**，不是装饰。
      #
      # Obsidian 的审核器会把 release 上的 `main.js` 与「从源码重建的产物」逐字节比对，
      # 对不上就报 "Build output does not match the released main.js artifact"。上一版
      # release 是**本地手工构建**后上传的，而本地是 Windows + Node 24，CI 是 Linux + Node 20 ——
      # 只要有一处影响产物字节（换行、依赖解析顺序、压缩器版本），比对就会失败。
      #
      # 下面三步把这个不确定性消掉：
      #   ① `pnpm store path` 打出 store 位置，出问题时能看出缓存是否命中；
      #   ② 构建一次并**打印产物哈希** —— 审核器比对的正是这个值，日志里能直接看到；
      #   ③ 再构建一次并比对哈希，证明**同一次 CI 内构建是幂等的**（排除时间戳/随机数进产物）。
      #
      # 真正的修复是「release 产物由 CI 构建并上传」—— 也就是本 workflow 的 `Release` 步骤。
      # 手工上传的产物与 CI 产物不必逐字节相同，**只要以后都走 CI**，比对就恒成立。
      - name: Report pnpm store
        run: pnpm store path

      - name: Build
        run: pnpm build

      - name: Report artifact hash
        run: |
          echo "main.js sha256: $(sha256sum main.js | cut -d' ' -f1)"
          echo "main.js bytes:  $(wc -c < main.js)"

      - name: Verify the build is reproducible
        run: |
          cp main.js /tmp/main.js.first
          pnpm build
          if ! cmp -s /tmp/main.js.first main.js; then
            echo "::error::构建不幂等 —— 两次构建的 main.js 不一致，产物里混进了非确定性内容"
            exit 1
          fi
          echo "✅ 两次构建逐字节一致"

      # 产物清单必须与 Obsidian 的期望一致：manifest.json 必需，main.js 必需，
      # styles.css 可选（本插件不打包 CSS，仓库根那个是给使用方本地覆盖的占位文件，
      # 见 CLAUDE.md 的「发布机制」一节 —— 因此**不**上传它）。
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            main.js
